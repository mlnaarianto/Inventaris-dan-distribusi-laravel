services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: project_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.75

  web:
    image: nginx:latest
    container_name: project_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    mem_limit: 256m
    cpus: 0.25

  db:
    image: mysql:8.0
    container_name: project_db
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=40
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: project
    ports:
      - "3308:3306"
    volumes:
      - project_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 0.75

  vite:
    image: node:20-alpine
    container_name: project_vite
    working_dir: /var/www
    volumes:
      - .:/var/www
      - project_vite_node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    mem_limit: 512m
    cpus: 0.5

volumes:
  project_dbdata:
  project_vite_node_modules: